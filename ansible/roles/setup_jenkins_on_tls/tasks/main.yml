---
- block:
  - name: copy keystore and trustore into /var/lib/jenkins/secrets
    ansible.builtin.copy:
      src: ./files/{{ item }}
      dest: /var/lib/jenkins/secrets/
      owner: jenkins
      group: jenkins
      mode: '0640'
    loop: ['aws_dummy_ops_jenkins.keystore']
    register: jenkins_user_result
    retries: 10
    delay: 5
    until: jenkins_user_result is succeeded

  - name: Create Jenkins environment directory
    ansible.builtin.file:
      path: /etc/jenkins
      state: directory
      owner: root
      group: jenkins
      mode: "0750"

  - name: Deploy Jenkins HTTPS environment file
    ansible.builtin.template:
      src: jenkins.env.j2
      dest: /etc/jenkins/jenkins.env
      owner: root
      group: jenkins
      mode: "0640"

  - name: update the jenkins.service with the dedicated template
    ansible.builtin.template:
      src: jenkins.service.j2
      dest: /usr/lib/systemd/system/jenkins.service
      owner: root
      group: root
    changed_when: false

  - name: Set /etc/default/jenkins from ENV
    ansible.builtin.copy:
      dest: /etc/default/jenkins
      owner: root
      group: root
      mode: '0640'
      content: "JENKINS_HTTPS_KEYSTORE_PASSWORD={{ lookup('env', 'JENKINS_HTTPS_KEYSTORE_PASSWORD') }}"

  - name: Ensure the /var/lib/jenkins/secrets/ has good perms
    ansible.builtin.file:
      path: '/var/lib/jenkins/secrets'
      state: directory
      owner: jenkins
      group: jenkins
      mode: '0750'

  - name: Ensure the /etc/jenkins folder exist
    ansible.builtin.file:
      path: '/etc/jenkins'
      state: directory
      owner: jenkins
      group: jenkins
      mode: '0750'

  - name: Copy the logging properties file
    ansible.builtin.copy:
      src: files/log.properties
      dest: /etc/jenkins
      owner: jenkins
      group: jenkins
      mode: '0644'

  - name: reload and restart jenkins.service
    ansible.builtin.systemd:
      name: jenkins.service
      state: restarted
      daemon_reload: yes
    changed_when: false
    register: jenkins_service_result
    retries: 10
    delay: 5
    until: jenkins_service_result is succeeded
  become: yes
