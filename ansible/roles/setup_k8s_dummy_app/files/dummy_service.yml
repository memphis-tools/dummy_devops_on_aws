apiVersion: v1
kind: Service
metadata:
  name: dummy-tomcat-service
  labels:
    app: dummy-tomcat
spec:
  selector:
    app: dummy-tomcat
  ports:
    - name: http
      protocol: TCP
      port: 8080
      targetPort: 8080
    - name: https
      protocol: TCP
      port: 8443
      targetPort: 8443
  type: LoadBalancer
